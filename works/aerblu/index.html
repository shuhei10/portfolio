<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>Aerblu</title>
    <meta
      name="description"
      content="AERBLU（エアブルー）は、「風のように自由に、青の世界へ旅する」をコンセプトにしたTシャツ中心のアウトドア&トラベルウェアブランドです。"
    />

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="img/tuananh-blue-qVDYGeHikVI-unsplash.jpg" />
    <link
      rel="apple-touch-icon"
      href="img/tuananh-blue-qVDYGeHikVI-unsplash.jpg"
    />
    <link rel="stylesheet" href="https://unpkg.com/ress/dist/ress.min.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <header id="header">
      <h1 class="logo-title">
        <p class="title">Aerblu</p>
      </h1>
    </header>
    <main>
      <div class="mainvisual">
        <img src="img/waves-2211925_1280.jpg" alt="" />
      </div>
    </main>
    <section class="concept wrapper">
      <div class="img">
        <img src="img/or-hakim-DFrHD6WIFLo-unsplash.jpg" alt="" />
      </div>
      <div class="text">
        <h2 class="section-title">
          もっと楽しく、もっと自由に<br />毎日が軽やかであるために
        </h2>
        <p class="description">
          AERBLUのTシャツは、敏感肌の方にもやさしいオーガニック素材を使用。
          <br
            class="only-sp"
          />空気のように軽く、旅先でも街でも自然に馴染む一枚です。
          毎日着たくなる“心地よさ”を、あなたの肌に。
        </p>
      </div>
    </section>
    <section class="new-shirt">
      <div class="collection">
        <h2 class="section-title">
          FRESH AIR<br />
          COLLECTION
        </h2>
        <div class="img-group">
          <div class="img1">
            <img src="img/tuananh-blue-2QY8S_VT2ZM-unsplash.jpg" alt="" />
          </div>
          <div class="img2">
            <img src="img/tuananh-blue-QKGZnrgnW0M-unsplash.jpg" alt="" />
          </div>
          <div class="img3">
            <img src="img/tuananh-blue-3EZnjoVzyr4-unsplash.jpg" alt="" />
          </div>
        </div>
      </div>
    </section>
    <section class="new-type">
      <div class="text">
        <div class="text-inner">
          <h2 class="section-title">
            風のように、軽く。<br />波のように、しなやかに。
          </h2>
          <p class="description">
            コンパクトにたたんで、旅にも日常にもスマートに。
            AERBLUは、自由を着るためのTシャツです。
          </p>
        </div>
      </div>
      <div class="img">
        <img src="img/tuananh-blue-QLGFz3FlIo4-unsplash.jpg" alt="" />
      </div>
    </section>
    <div class="find-your-tee">
      <div class="box">
        <p class="title">FIND YOUR TEE</p>
        <a href="#" class="find-btn">あなたにぴったりの一枚を見つけよう</a>
      </div>
    </div>
    <footer id="footer">
      <div class="inner wrapper">
        <div class="logo">
          <p class="aerblu">Aerblu</p>
        </div>
        <p class="copyright">©2025 Aerblu</p>
      </div>
    </footer>
  </body>
</html>
